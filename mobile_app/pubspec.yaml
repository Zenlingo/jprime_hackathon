name: mobile_app
description: "jPrime Conference Companion App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  webview_flutter: ^4.10.0
  mobile_scanner: ^6.0.2
  permission_handler: ^11.3.0
  geolocator: ^13.0.0
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/jprime-icon-1024.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/jprime-icon-1024.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/venue/
